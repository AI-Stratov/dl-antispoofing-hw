
defaults:
  - model: lcnn
  - writer: wandb
  - metrics: asvspoof
  - datasets: asvspoof
  - dataloader: asvspoof
  - transforms: lfcc
  - _self_

data_root: data/dummy/LA/LA

model:
  input_freq: 60
  input_time: 487

writer:
  run_name: "lcnn_lfcc"

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4
lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.5
  step_size: 31720
loss_function:
  _target_: src.loss.CrossEntropyLoss

  weight: null
trainer:
  log_step: 50
  n_epochs: 10
  epoch_len: null
  device_tensors: ["data_object", "labels"]
  resume_from: null
  device: auto
  override: True
  monitor: "off"
  save_period: 10
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 1
