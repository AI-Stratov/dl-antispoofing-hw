
defaults:
  - model: lcnn
  - writer: wandb
  - metrics: asvspoof
  - datasets: asvspoof_onebatchtest
  - dataloader: asvspoof
  - transforms: asvspoof
  - _self_

data_root: data/dummy/LA/LA

writer:

  run_name: "onebatchtest"

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4
lr_scheduler:

  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 1.0
  step_size: 1000
loss_function:
  _target_: src.loss.CrossEntropyLoss
trainer:
  log_step: 10
  n_epochs: 200
  epoch_len: null
  device_tensors: ["data_object", "labels"]
  resume_from: null
  device: auto
  override: True
  monitor: "min val_EER"
  save_period: 1000
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 1
